services:
  db:
    image: postgres:16-alpine
    container_name: lifeguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeguard_pass}
      POSTGRES_DB: ${POSTGRES_DB:-lifeguard_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifeguard} -d ${POSTGRES_DB:-lifeguard_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifeguard-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lifeguard}:${POSTGRES_PASSWORD:-lifeguard_pass}@db:5432/${POSTGRES_DB:-lifeguard_db}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-this-to-a-long-random-secret-key-32chars}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ml:/app/ml
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lifeguard-frontend
    restart: unless-stopped
    environment:
      # Vite dev proxy forwards /api requests inside the Docker network to the backend service
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
