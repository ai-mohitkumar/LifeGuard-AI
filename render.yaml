services:
  # -------------------------------------------------------------------------
  # LifeGuard AI Backend API (FastAPI + SQLAlchemy + ML Models)
  # -------------------------------------------------------------------------
  - type: web
    name: lifeguard-ai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///./lifeguard_prod.db
      - key: GOOGLE_CLIENT_ID
        value: 981860772372-uvhn6fnfkfhpfskar3bk1i7de4fsp3b9.apps.googleusercontent.com
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  # -------------------------------------------------------------------------
  # LifeGuard AI Frontend Client (React 18 + Vite SPA)
  # -------------------------------------------------------------------------
  - type: web
    name: lifeguard-ai-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_GOOGLE_CLIENT_ID
        value: 981860772372-uvhn6fnfkfhpfskar3bk1i7de4fsp3b9.apps.googleusercontent.com
