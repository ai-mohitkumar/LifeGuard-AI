services:
  db:
    image: postgres:16-alpine
    container_name: lifeguard-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeguard_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-lifeguard_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifeguard} -d ${POSTGRES_DB:-lifeguard_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifeguard-backend-prod
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-lifeguard}:${POSTGRES_PASSWORD:-lifeguard_secure_pass_2026}@db:5432/${POSTGRES_DB:-lifeguard_db}
      SECRET_KEY: ${SECRET_KEY:-generate_with_openssl_rand_hex_32}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      COOKIE_SECURE: "true"
      GOOGLE_CLIENT_ID: 981860772372-uvhn6fnfkfhpfskar3bk1i7de4fsp3b9.apps.googleusercontent.com
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      PYTHONPATH: /app
    volumes:
      - ./backend:/app
      - ./ml:/app/ml
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: lifeguard-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data_prod:
